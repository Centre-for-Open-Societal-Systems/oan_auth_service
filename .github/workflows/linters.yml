name: Linters

on:
  pull_request:
  workflow_dispatch:
  # Other Frappe apps on oan_auth_service run the same checks:
  #   uses: Centre-for-Open-Societal-Systems/oan_auth_service/.github/workflows/linters.yml@develop
  # A repo without its own commitlint.config.mjs or .semgrep/rules.yml gets this repo's.
  workflow_call:
    inputs:
      auth-service-ref:
        description: "oan_auth_service branch to take the shared lint config from"
        type: string
        default: develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: "Semantic Commits"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Shared commitlint config
        if: hashFiles('commitlint.config.mjs') == ''
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Centre-for-Open-Societal-Systems/oan_auth_service/${{ inputs.auth-service-ref || 'develop' }}/commitlint.config.mjs" -o commitlint.config.mjs

      - name: Check commit titles
        run: |
          npm install @commitlint/cli @commitlint/config-conventional
          npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  linter:
    name: "Frappe Linter"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      SEMGREP_SEND_METRICS: 'off'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: pre-commit/action@v3.0.1

      - name: Download Semgrep rules
        run: |
          git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules
          if [ ! -f .semgrep/rules.yml ]; then
            git clone --depth 1 --branch "${{ inputs.auth-service-ref || 'develop' }}" https://github.com/Centre-for-Open-Societal-Systems/oan_auth_service.git /tmp/oan_auth_service
            echo "SHARED_RULES=/tmp/oan_auth_service/.semgrep/rules.yml" >> "$GITHUB_ENV"
          else
            echo "SHARED_RULES=.semgrep/rules.yml" >> "$GITHUB_ENV"
          fi

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --metrics=off --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness --config "$SHARED_RULES"

  deps-vulnerable-check:
    name: "Vulnerable Dependency Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on .
