name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  # Other Frappe apps on oan_auth_service run the same job:
  #   uses: Centre-for-Open-Societal-Systems/oan_auth_service/.github/workflows/ci.yml@develop
  #   with: { app: oan_my_app, frappe-branch: version-16 }
  workflow_call:
    inputs:
      app:
        description: "The app under test, checked out in the caller's workspace"
        type: string
        default: oan_auth_service
      frappe-branch:
        description: "Frappe branch for bench init. Empty takes frappe's default branch."
        type: string
        default: ""
      auth-service-ref:
        description: "oan_auth_service branch to install when `app` is another app"
        type: string
        default: develop

concurrency:
  group: ci-oan-auth-service-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server Tests
    env:
      # A direct run (push, pull_request) has no inputs, so these fall back to this repo.
      APP: ${{ inputs.app || 'oan_auth_service' }}
      FRAPPE_BRANCH: ${{ inputs.frappe-branch }}
      AUTH_SERVICE_REF: ${{ inputs.auth-service-ref || 'develop' }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Setup Bench
        run: |
          pip install frappe-bench
          bench init ${FRAPPE_BRANCH:+--frappe-branch "$FRAPPE_BRANCH"} --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install App
        working-directory: /home/runner/frappe-bench
        run: |
          # Another app runs on top of oan_auth_service, so it is installed first.
          if [ "$APP" != "oan_auth_service" ]; then
            bench get-app oan_auth_service https://github.com/Centre-for-Open-Societal-Systems/oan_auth_service.git --branch "$AUTH_SERVICE_REF"
          fi
          bench get-app "$APP" "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          if [ "$APP" != "oan_auth_service" ]; then
            bench --site test_site install-app oan_auth_service
          fi
          bench --site test_site install-app "$APP"
          bench build
        env:
          CI: "Yes"

      # An app with no tests still gets the site build and install above, which catches a
      # broken hook, doctype or import.
      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          if ! grep -rq "def test" "$GITHUB_WORKSPACE/$APP"; then
            echo "No tests in $APP; the site installed, so nothing more to run."
            exit 0
          fi
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app "$APP"
        env:
          TYPE: server
