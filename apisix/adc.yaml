services:
- name: oan-auth-service-v1
  labels:
    app: oan-auth
  upstream:
    scheme: http
    nodes:
    - host: oan-auth.internal.svc
      port: 8000
      weight: 1
    pass_host: rewrite
    upstream_host: mysite.localhost
    timeout:
      connect: 5
      send: 20
      read: 20
    retries: 2
  plugins:
    cors:
      allow_origins: 'null'
      allow_origins_by_regex:
      - https?://localhost(:[0-9]+)?
      allow_methods: GET,POST,PATCH,DELETE,OPTIONS
      allow_headers: Authorization,Content-Type,X-Request-Id,X-CSRF-Token
      allow_credential: true
      max_age: 3600
    client-control:
      max_body_size: 5242880
    request-id:
      header_name: X-Request-Id
      include_in_response: true
    prometheus:
      prefer_name: true
    proxy-rewrite:
      regex_uri:
      - ^/(v[0-9]+)/(.*)
      - /api/$1/$2
  routes:
  - name: oan-auth-admin-bearer-delete
    description: Admin user and role management. Low volume; per-consumer cap limits a leaked admin token.
    labels:
      app: oan-auth
      tier: admin
      auth: bearer
    uris:
    - /v1/admin/users/:user_id/roles/:role
    - /v1/admin/users/:user_id/sessions
    methods:
    - DELETE
    plugins:
      limit-count:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        show_limit_quota_header: true
        policy: redis
        redis_host: redis
        redis_port: 6379
        allow_degradation: true
  - name: oan-auth-admin-bearer-get
    description: Admin user and role management. Low volume; per-consumer cap limits a leaked admin token.
    labels:
      app: oan-auth
      tier: admin
      auth: bearer
    uris:
    - /v1/admin/roles
    - /v1/admin/users
    - /v1/admin/users/:user_id
    - /v1/admin/users/:user_id/roles
    methods:
    - GET
    plugins:
      limit-count:
        rules:
        - count: 60
          time_window: 60
          key: $remote_addr:min
        - count: 1000
          time_window: 3600
          key: $remote_addr:hour
        rejected_code: 429
        show_limit_quota_header: true
        policy: redis
        redis_host: redis
        redis_port: 6379
        allow_degradation: true
  - name: oan-auth-admin-bearer-patch
    description: Admin user and role management. Low volume; per-consumer cap limits a leaked admin token.
