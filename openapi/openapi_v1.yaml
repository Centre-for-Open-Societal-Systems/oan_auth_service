          nullable: true
          description: Defaults to jwt_default_registration_role
        temporary_password: &id015
          type: string
          format: password
          minLength: 8
          maxLength: 128
          nullable: true
          description: At least 8 characters with a letter and a digit. Generated and returned once when
            omitted.
      additionalProperties: true
      required:
      - full_name
      description: Provide email, phone_number or both. Extra fields are passed to on_user_registered
        hooks.
    AdminUpdateUserRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 140
        last_name:
          type: string
          maxLength: 140
          nullable: true
        email:
          type: string
          format: email
          nullable: true
          description: Empty or null clears it
        phone_number:
          type: string
          nullable: true
          description: Empty or null clears it
        country_code:
          type: string
          example: '+251'
          nullable: true
        enabled:
