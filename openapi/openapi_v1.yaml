        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      x-legacy-rpc-method: oan_auth_service.api.v1.auth.register_user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication & Session
      summary: Exchange single-use refresh token
      description: 'Exchange a refresh token for a new pair, rotating the stored row.


        The presented token is single-use: the row backing it is deleted whether the

        exchange succeeds or fails, so a replayed token cannot mint a second pair.'
      operationId: post_api_v1_auth_refresh
      responses:
        '200':
          description: Success
          content:
