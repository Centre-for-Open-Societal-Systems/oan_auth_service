  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication & Session
      summary: Refresh a session
      description: 'Send exactly one credential. `refresh_token` (this app''s session): exchanged for
        a new access token and rotated refresh token. `access_token` (an IAM session, expired token accepted):
        its issuer picks the IAM, which refreshes from the forwarded IAM cookies (`<cookie_prefix>X-Access-Token`,
        `X-ID-Token`, `X-Session-Id`); relay every `Set-Cookie` of the response to the browser unchanged,
        they carry the new tokens. The IAM answer is `refreshed: true` when a new access token was issued,
        `false` when the current one is still valid. Session over: 401, log the user out. IAM unreachable:
        503, keep the session and retry.'
      operationId: post_api_v1_auth_refresh
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: Validation or Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication & Session
      summary: End a session
      description: 'Send exactly one credential. `refresh_token` (this app''s session): revoked; access
        tokens expire on their own. `access_token` (an IAM session, expired token accepted): its issuer
        picks the IAM; forward that IAM''s cookies (`<cookie_prefix>X-Access-Token`, `X-ID-Token`, `X-Session-Id`)
        and relay every `Set-Cookie` of the response, they clear IAM''s cookies. `provider_logout: true`
        means the identity provider session was ended too; otherwise, when `logout_url` is present, send
        the browser there to end it.'
      operationId: post_api_v1_auth_logout
      responses:
        '200':
