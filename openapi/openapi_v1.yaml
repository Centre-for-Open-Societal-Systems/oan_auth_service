components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide access token as `Bearer <token>` in the Authorization header.
  schemas:
    ApiMeta:
      type: object
      properties:
        api_version:
          type: string
          example: v1
          description: Semantic API version
        status:
          type: string
          example: current
          description: Lifecycle status
      required:
      - api_version
    StandardErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
          enum:
          - error
        message:
          type: string
          description: Human-readable error description
        exception:
          type: string
          nullable: true
          description: Exception class name
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                nullable: true
                description: Field causing the validation error
              message:
                type: string
                description: Error message for the specific field
          nullable: true
          description: Structured validation errors if applicable
        meta:
          $ref: '#/components/schemas/ApiMeta'
        request_id:
          type: string
          format: uuid
          nullable: true
          description: Tracing correlation ID
      required:
      - status
      - message
      description: Standard error envelope returned on 4xx/5xx responses
    TokenPairData:
      type: object
      properties:
        access_token:
          type: string
          description: Short-lived JWT access token
        refresh_token:
          type: string
          description: Single-use cryptographically secure refresh token
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
          description: Access token expiration in seconds
        user:
          type: string
          example: USR-0001
          description: Canonical user ID or synthetic email
        roles:
          type: array
          items:
            type: string
          description: Roles assigned to this user
        scope:
          type: array
          items:
            type: string
          nullable: true
          description: Narrowed token scope if requested
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user
      - roles
      description: Access token and refresh token pair
    RegisterData:
      type: object
      properties:
        user:
          type: string
          example: USR-0001
          description: Canonical user ID or synthetic email
        roles:
          type: array
          items:
            type: string
          description: Roles assigned to this user
      required:
      - user
      - roles
      description: The created account. No tokens are issued; sign in to obtain them.
    LogoutData:
      type: object
      properties:
        revoked:
          type: boolean
          description: Whether the refresh token was revoked
      required:
      - revoked
    UserMeData:
      type: object
      properties:
        user:
          type: string
          description: Unique User ID / internal handle
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        full_name:
          type: string
          description: Full display name
        login_email:
          type: string
          format: email
          nullable: true
          description: Authoritative login email
        mobile_no:
          type: string
          nullable: true
          description: Primary contact mobile number in E.164 format
        country_code:
          type: string
          example: '+251'
          nullable: true
          description: E.164 country dialing code
        phone_number:
          type: string
          example: '911223344'
          nullable: true
          description: National subscriber phone number
        roles:
          type: array
          items:
            type: string
          description: List of assigned roles
        profiles:
          type: object
          properties: {}
          additionalProperties: true
          description: App-specific profiles collected from on_user_profile hooks (e.g. grievance)
      required:
      - user
      - full_name
      - roles
      description: Introspected user identity and profile claims
    PublicKeyItem:
      type: object
      properties:
        kid:
          type: string
          description: Key Identifier
        kty:
          type: string
          example: RSA
          description: Key Type
        alg:
          type: string
          example: RS256
          description: Algorithm
        use:
          type: string
          example: sig
          description: Key usage
        n:
          type: string
          description: RSA modulus, base64url
        e:
          type: string
          example: AQAB
          description: RSA public exponent, base64url
      required:
      - kid
      - kty
      - alg
      - use
      - n
      - e
    PublicKeysData:
      type: object
      properties:
        issuer:
          type: string
          description: JWT issuer identifier
        algorithm:
          type: string
          example: RS256
        active_kid:
          type: string
          description: Currently active Key ID used for signing
        keys:
          type: array
          items:
            $ref: '#/components/schemas/PublicKeyItem'
      required:
      - issuer
      - algorithm
      - active_kid
      - keys
      description: RS256 public keys (JWKS) that verify access tokens, and the active signing kid
    HealthData:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: oan_auth_service
        api_version:
          type: string
          example: v1
      required:
      - status
      - service
      - api_version
      description: Service health status
    MetadataData:
      type: object
      properties:
        auth:
          type: object
          properties:
            self_registerable_roles:
              type: array
              items:
                type: string
              description: Roles allowed during public self-registration
          required:
          - self_registerable_roles
      additionalProperties: true
      required:
      - auth
      description: Aggregated reference metadata across installed apps
    MessageOnlyData:
      type: object
      properties:
        message:
          type: string
          description: Status confirmation message
      required:
      - message
    AdminUserData:
      type: object
      properties:
        user: &id001
          type: string
          example: 3f9c0a1b2d4e5f60@id.openagrinet.internal
          description: User id
        first_name: &id002
          type: string
          nullable: true
        last_name: &id003
          type: string
          nullable: true
        full_name: &id004
          type: string
          nullable: true
        login_email: &id005
          type: string
          format: email
          nullable: true
        mobile_no: &id006
          type: string
          nullable: true
          description: E.164
        country_code: &id007
          type: string
          example: '+251'
          nullable: true
        phone_number: &id008
          type: string
          example: '911223344'
          nullable: true
          description: National subscriber number
        roles: &id009
          type: array
          items:
            type: string
          description: Granted roles, without the implicit ones
        enabled: &id010
          type: boolean
        must_change_password: &id011
          type: boolean
          description: Holds a temporary password that must be replaced
        is_delegated: &id012
          type: boolean
          description: Signs in through the IAM service; roles are managed there
        creation: &id013
          type: string
          description: Creation timestamp
      required: &id014
      - user
      - roles
      - enabled
      - must_change_password
      - is_delegated
      description: A user account as admins see it
    AdminUserDetailData:
      type: object
      properties:
        user: *id001
        first_name: *id002
        last_name: *id003
        full_name: *id004
        login_email: *id005
        mobile_no: *id006
        country_code: *id007
        phone_number: *id008
        roles: *id009
        enabled: *id010
        must_change_password: *id011
        is_delegated: *id012
        creation: *id013
        profiles:
          type: object
          properties: {}
          additionalProperties: true
          description: App-specific profiles from on_user_profile hooks
      required: *id014
      description: A user account with app-specific profiles
    AdminCreatedUserData:
      type: object
      properties:
        user: *id001
        first_name: *id002
        last_name: *id003
        full_name: *id004
        login_email: *id005
        mobile_no: *id006
        country_code: *id007
        phone_number: *id008
        roles: *id009
        enabled: *id010
        must_change_password: *id011
        is_delegated: *id012
        creation: *id013
        temporary_password:
          type: string
          format: password
          description: Present only when generated by the server. Shown once; hand it to the user.
      required: *id014
      description: The created account
    AdminUserRolesData:
      type: object
      properties:
        user:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
