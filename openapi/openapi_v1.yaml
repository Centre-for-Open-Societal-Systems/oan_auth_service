components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide access token as `Bearer <token>` in the Authorization header.
  schemas:
    ApiMeta:
      type: object
      properties:
        api_version:
          type: string
          example: v1
          description: Semantic API version
        status:
          type: string
          example: current
          description: Lifecycle status
      required:
      - api_version
    StandardErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
          enum:
          - error
        message:
          type: string
          description: Human-readable error description
        exception:
          type: string
          nullable: true
          description: Exception class name
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                nullable: true
                description: Field causing the validation error
              message:
                type: string
                description: Error message for the specific field
          nullable: true
          description: Structured validation errors if applicable
        meta:
          $ref: '#/components/schemas/ApiMeta'
        request_id:
          type: string
          format: uuid
          nullable: true
          description: Tracing correlation ID
      required:
      - status
      - message
      description: Standard error envelope returned on 4xx/5xx responses
    TokenPairData:
      type: object
      properties:
        access_token:
          type: string
          description: Short-lived JWT access token
        refresh_token:
          type: string
          description: Single-use cryptographically secure refresh token
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
          description: Access token expiration in seconds
        user:
          type: string
          example: USR-0001
          description: Canonical user ID or synthetic email
        roles:
          type: array
          items:
            type: string
          description: Roles assigned to this user
        scope:
          type: array
          items:
            type: string
          nullable: true
          description: Narrowed token scope if requested
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user
      - roles
      description: Access token and refresh token pair
    LogoutData:
      type: object
      properties:
        revoked:
          type: boolean
          description: Whether the refresh token was revoked
      required:
      - revoked
    UserMeData:
      type: object
      properties:
        user:
          type: string
          description: Unique User ID / internal handle
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        full_name:
          type: string
          description: Full display name
        login_email:
          type: string
          format: email
          nullable: true
          description: Authoritative login email
        mobile_no:
          type: string
          nullable: true
          description: Primary contact mobile number in E.164 format
        country_code:
          type: string
          example: '+251'
          nullable: true
          description: E.164 country dialing code
        phone_number:
          type: string
          example: '911223344'
          nullable: true
          description: National subscriber phone number
        roles:
          type: array
          items:
            type: string
          description: List of assigned roles
        profiles:
          type: object
          properties: {}
          additionalProperties: true
          description: App-specific profiles collected from on_user_profile hooks (e.g. grievance)
      required:
      - user
      - full_name
      - roles
      description: Introspected user identity and profile claims
    PublicKeyItem:
      type: object
      properties:
        kid:
          type: string
          description: Key Identifier
        kty:
          type: string
          example: oct
          description: Key Type
        alg:
          type: string
          example: HS256
          description: Algorithm
        use:
          type: string
          example: sig
          description: Key usage
      required:
      - kid
      - kty
      - alg
      - use
    PublicKeysData:
      type: object
      properties:
        issuer:
          type: string
          description: JWT issuer identifier
        algorithm:
          type: string
          example: HS256
        active_kid:
          type: string
          description: Currently active Key ID used for signing
        keys:
          type: array
          items:
            $ref: '#/components/schemas/PublicKeyItem'
      required:
      - issuer
      - algorithm
      - active_kid
      - keys
      description: Active HMAC signing key ID (kid) and algorithm configuration
    HealthData:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: oan_auth_service
        api_version:
          type: string
          example: v1
      required:
      - status
      - service
      - api_version
      description: Service health status
    MetadataData:
      type: object
      properties:
        auth:
          type: object
          properties:
            self_registerable_roles:
              type: array
              items:
                type: string
              description: Roles allowed during public self-registration
          required:
          - self_registerable_roles
      additionalProperties: true
      required:
      - auth
      description: Aggregated reference metadata across installed apps
    MessageOnlyData:
      type: object
      properties:
        message:
          type: string
          description: Status confirmation message
      required:
      - message
    RegisterRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Password meeting complexity requirements (at least 8 characters with letters, numbers,
            and special characters)
        full_name:
          type: string
          minLength: 1
          maxLength: 140
          description: Full name of user or organization
        email:
          type: string
          format: email
          nullable: true
          description: Login email address
        phone_number:
          type: string
          nullable: true
          description: E.164 formatted phone number e.g. +251911223344
        country_code:
          type: string
          example: '+251'
          nullable: true
          description: Country dialing code e.g. +251, +91, +1
        phone:
          type: string
          example: '911223344'
          nullable: true
          description: National subscriber phone number
        role:
          type: string
          nullable: true
          description: Singular role to request
        roles:
          type: array
          items:
            type: string
          nullable: true
          description: Multiple roles to request
      additionalProperties: true
      required:
      - password
      - full_name
      description: Payload for registering a new user account. Additional fields are forwarded to domain
        hooks.
    LoginRequest:
      type: object
      properties:
        usr:
          type: string
          minLength: 1
          description: 'Login identifier: email, mobile number, or User ID'
        pwd:
          type: string
          format: password
          minLength: 1
          description: Account password
        remember_me:
          type: boolean
          default: false
          description: Extend refresh token lifetime to 90 days
        scope:
          type: string
          nullable: true
          description: 'Optional scope narrowing: comma-separated list of roles'
      required:
      - usr
      - pwd
      description: Credentials to authenticate and obtain token pair
    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: Active single-use refresh token
      required:
      - refresh_token
      description: Refresh token exchange payload
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: Active refresh token to revoke
      required:
      - refresh_token
      description: Revoke refresh token session
    ForgotPasswordRequest:
      type: object
      properties:
        usr:
          type: string
          minLength: 1
          description: Login handle (email or phone number) to initiate recovery
      required:
      - usr
      description: Password recovery initiation request
    ResetPasswordRequest:
      type: object
      properties:
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: New account password (min 8 chars, letters, numbers, symbols)
        key:
          type: string
          nullable: true
          description: Reset token key received via email link
        usr:
          type: string
          nullable: true
          description: Login identifier (used alongside SMS OTP)
        otp:
          type: string
          nullable: true
          description: Numeric one-time verification code received via SMS
      required:
      - new_password
      description: Password reset completion payload. Provide either `key` OR (`usr` and `otp`).
    TokenPairResponse:
      type: object
      properties:
        status:
          type: string
          example: success
          enum:
          - success
        message:
          type: string
          nullable: true
          description: Optional response message
        data:
          $ref: '#/components/schemas/TokenPairData'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        request_id:
          type: string
          format: uuid
          nullable: true
          description: Tracing correlation ID
      required:
      - status
      - data
      description: Token pair response
    LogoutResponse:
      type: object
      properties:
        status:
          type: string
          example: success
          enum:
          - success
        message:
          type: string
          nullable: true
          description: Optional response message
        data:
          $ref: '#/components/schemas/LogoutData'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        request_id:
          type: string
          format: uuid
          nullable: true
          description: Tracing correlation ID
      required:
      - status
      - data
      description: Logout revocation response
    UserMeResponse:
      type: object
      properties:
        status:
          type: string
          example: success
          enum:
          - success
        message:
          type: string
          nullable: true
          description: Optional response message
        data:
          $ref: '#/components/schemas/UserMeData'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        request_id:
          type: string
          format: uuid
          nullable: true
          description: Tracing correlation ID
      required:
      - status
      - data
      description: Authenticated user introspection response
    PublicKeysResponse:
      type: object
      properties:
        status:
          type: string
          example: success
          enum:
          - success
        message:
          type: string
          nullable: true
          description: Optional response message
        data:
          $ref: '#/components/schemas/PublicKeysData'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        request_id:
          type: string
          format: uuid
          nullable: true
          description: Tracing correlation ID
      required:
