- name: Identity & Profile
  description: User profile introspection and claims
- name: System & Keys
  description: Health check, public key discovery, and metadata
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Authentication & Session
      summary: Login and obtain token pair
      description: 'Authenticate and issue an access token plus a refresh token.


        `scope` is optional and may only narrow — see `_narrow_to_scope`. Roles are

        always resolved server-side from the authenticated user; nothing the caller

        sends can widen them.'
      operationId: post_api_v1_auth_login
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: Validation or Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      x-legacy-rpc-method: oan_auth_service.api.v1.auth.login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/register:
    post:
      tags:
      - Authentication & Session
      summary: Register a new user account
      description: 'Create a User and its role assignment, trigger registered hooks, and issue the first
        token pair.


        - Guest callers can self-assign roles listed in `jwt_self_registerable_roles` in site_config.json.

        - If no role is requested, `jwt_default_registration_role` is assigned (if configured).

        - Authenticated administrators (e.g. System Manager) can assign any valid role.

        - Broadcasts `on_user_registered` hooks for consuming apps to initialize and link domain DocTypes.'
      operationId: post_api_v1_auth_register
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
        '400':
          description: Validation or Client Error
          content:
