    RegisterRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Password meeting complexity requirements (at least 8 characters with letters, numbers,
            and special characters)
        full_name:
          type: string
          minLength: 1
          maxLength: 140
          description: Full name of user or organization
        email:
          type: string
          format: email
          nullable: true
          description: Login email address
        phone_number:
          type: string
          nullable: true
          description: Phone number. Can be full international E.164 format (e.g. +251911223344) or national
            subscriber digits when country_code is provided.
        country_code:
          type: string
          example: '+251'
          nullable: true
          description: Optional country dialing code (e.g. +251, +91). When provided, phone_number is
            treated as national digits.
        role:
          type: string
          nullable: true
          description: Singular role to request
        roles:
          type: array
          items:
            type: string
          nullable: true
          description: Multiple roles to request
      additionalProperties: true
      required:
      - password
      - full_name
      description: Payload for registering a new user account with email or phone_number. When country_code
        is provided, phone_number is treated as the national subscriber number; otherwise, it must be
        in full international E.164 format.
    LoginRequest:
      type: object
      properties:
        usr:
          type: string
          minLength: 1
          description: 'Login identifier: email, mobile number, or User ID'
        pwd:
          type: string
          format: password
          minLength: 1
          description: Account password
        remember_me:
          type: boolean
          default: false
          description: Extend refresh token lifetime to 90 days
        scope:
          type: string
          nullable: true
          description: 'Optional scope narrowing: comma-separated list of roles'
      required:
      - usr
      - pwd
      description: Credentials to authenticate and obtain token pair
    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: Active single-use refresh token
      required:
      - refresh_token
      description: Refresh token exchange payload
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: Active refresh token to revoke
      required:
      - refresh_token
      description: Revoke refresh token session
    ForgotPasswordRequest:
      type: object
      properties:
        usr:
          type: string
          minLength: 1
          description: Login handle (email or phone number) to initiate recovery
      required:
      - usr
      description: Password recovery initiation request
    ResetPasswordRequest:
      type: object
      properties:
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: New account password (min 8 chars, letters, numbers, symbols)
        key:
          type: string
          nullable: true
          description: Reset token key received via email link
        usr:
          type: string
          nullable: true
          description: Login identifier (used alongside SMS OTP)
        otp:
          type: string
          nullable: true
          description: Numeric one-time verification code received via SMS
      required:
      - new_password
      description: Password reset completion payload. Provide either `key` OR (`usr` and `otp`).
    SetInitialPasswordRequest:
      type: object
      properties:
        usr:
          type: string
          minLength: 1
          description: 'Login identifier: email, mobile number, or User ID'
        current_password:
          type: string
          format: password
          minLength: 1
          description: The temporary password
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: The account holder's own password (min 8 chars, letters, numbers, symbols). Must
            differ from the temporary one.
      required:
      - usr
      - current_password
      - new_password
      description: Replace a temporary password. No token is needed or issued; sign in afterwards.
    AdminCreateUserRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 140
        email:
          type: string
          format: email
          nullable: true
          description: Login email
        phone_number:
          type: string
          nullable: true
          description: E.164, or national digits when country_code is provided
        country_code:
          type: string
          example: '+251'
          nullable: true
        roles:
